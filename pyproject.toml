[project]
name = "bnpl-tiktok-corpus"
version = "0.1.0"
description = "TikTok Research API corpus of Italian Buy Now, Pay Later content for a thesis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyter==1.1.1",
    "matplotlib==3.11.2",
    "pandas==3.0.6",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["scripts"]
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
