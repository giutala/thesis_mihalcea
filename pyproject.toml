[project]
name = "thesis-laura-analysis"
version = "0.1.0"
description = "Descriptive analysis of a manually coded qualitative interview codebook"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hdbscan==0.8.44",
    "jupyter==1.1.1",
    "matplotlib==3.11.2",
    "networkx==3.7",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "pyvis==0.3.2",
    "python-frontmatter==1.3.0",
    "rich==15.0.0",
    "scikit-learn==1.9.1",
    "seaborn==0.13.2",
    "sentence-transformers==6.1.0",
    "umap-learn==0.5.12",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["scripts"]
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
